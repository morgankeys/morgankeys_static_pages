<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n8n Personal App | Morgan Keys</title>
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100dvh;
    background: #fffcf8;
    color: #555;
    font-family: Inter, system-ui, sans-serif;
  }
  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(3rem, 8vw, 6rem);
    padding: clamp(3rem, 10vw, 6rem) clamp(1.25rem, 6vw, 4rem) clamp(4rem, 12vw, 6rem);
    max-width: 100%;
  }
  .hero-img {
    width: min(384px, 85vw);
    height: auto;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    width: min(800px, 100%);
    align-items: stretch;
  }
  .titles {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
    text-align: center;
  }
  .titles h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 800;
    line-height: normal;
    letter-spacing: -0.02em;
  }
  .titles .subtitle {
    font-family: Inter, system-ui, sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    font-weight: 400;
    line-height: normal;
  }
  .callout {
    background: #f7f7f7;
    border-radius: 16px;
    padding: clamp(1.75rem, 5vw, 3rem) clamp(1.25rem, 8vw, 4rem);
    text-align: center;
  }
  .callout p {
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    font-weight: 500;
    line-height: 1.5;
  }
  .callout p + p {
    margin-top: 1em;
  }
  .actions {
    font-family: Inter, system-ui, sans-serif;
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    text-align: center;
    margin-top: -1rem;
  }
  .actions a {
    color: #555;
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }
  .actions a:hover {
    color: #333;
  }
</style>
</head>
<body>
  <main class="page">
    <img class="hero-img" src="profile-pic-logo.svg" alt="" width="384" height="384">

    <div class="column">
      <div class="titles">
        <h1>n8n Personal App</h1>
        <p class="subtitle">Personal Use Only</p>
      </div>
      <div class="callout">
        <p>This application is a personal automation tool operated solely by its developer for their own private use.</p>
        <p>No other users have access to this application, and no third-party data is collected, stored, or shared.</p>
      </div>
    </div>

    <p class="actions"><a href="/webhook/home">Login</a> · <a href="policy.html">Privacy Policy &amp; Terms of Service</a></p>
  </main>
</body>
</html>
