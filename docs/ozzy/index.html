<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ozzy AI</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Outfit:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #1d1d1d;
        color: #fff;
      }
      .home {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 96px;
        width: 100%;
        max-width: 100%;
        padding: 96px 64px;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        width: min(304px, 100%);
      }
      .logo {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
      }
      .logo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .hero h1 {
        margin: 0;
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        font-size: 32px;
        line-height: normal;
        text-align: center;
      }
      .callout {
        width: min(800px, 100%);
        background: #161616;
        border-radius: 16px;
        padding: 48px 64px;
        text-align: center;
      }
      .callout p {
        margin: 0;
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 20px;
        line-height: 1.5;
        color: #ccc;
      }
      .callout p + p {
        margin-top: 1.5em;
      }
      .links {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-family: "Inter", sans-serif;
        font-weight: 300;
        font-size: 20px;
        line-height: normal;
      }
      .links a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @media (max-width: 640px) {
        .home {
          padding: 48px 24px;
          gap: 64px;
        }
        .callout {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="home">
      <header class="hero">
        <div class="logo">
          <img
            alt="Ozzy AI logo"
            src="logo.svg"
            width="304"
            height="304"
          />
        </div>
        <h1>Ozzy AI</h1>
      </header>

      <section class="callout" aria-label="About this application">
        <div>
          <p>
            This application is a personal automation tool operated solely by its developer for their own private use.
          </p>
          <p>
            No other users have access to this application, and no third-party data is collected, stored, or shared.
          </p>
        </div>
      </section>

      <div class="links">
        <a href="policy.html">Privacy Policy &amp; Terms of Service</a>
      </div>
    </main>
  </body>
</html>
